<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>To-Do</h1>
      <button id="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>
    <form id="add-form">
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <ul id="task-list"></ul>
    <button type="button" id="clear-completed">Clear completed</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
