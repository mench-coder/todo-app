<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>To-Do</h1>
    <form id="add-form">
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <div class="toolbar">
      <p id="task-count">0 tasks left</p>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" class="filter is-active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter" data-filter="done" aria-pressed="false">Done</button>
      </div>
    </div>
    <ul id="task-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
